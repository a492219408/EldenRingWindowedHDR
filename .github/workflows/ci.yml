name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Format, lint, test, and build
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Package release archive
        shell: pwsh
        run: .\scripts\package.ps1 -SkipBuild

      - name: Resolve package version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"$').Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Cannot read Cargo package version' }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload packaged mod
        uses: actions/upload-artifact@v7
        with:
          name: EldenRingWindowedHDR-${{ env.PACKAGE_VERSION }}
          path: |
            dist/EldenRingWindowedHDR-${{ env.PACKAGE_VERSION }}.zip
            dist/EldenRingWindowedHDR-${{ env.PACKAGE_VERSION }}.zip.sha256
          if-no-files-found: error
