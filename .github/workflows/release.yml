name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"$').Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Cannot read Cargo package version' }
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match Cargo version '$expectedTag'"
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Format, lint, test, build, and package
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = "dist/EldenRingWindowedHDR-$env:PACKAGE_VERSION.zip"
          $checksum = "$archive.sha256"
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:GITHUB_REF_NAME $archive $checksum --clobber --repo $env:GITHUB_REPOSITORY
              gh release edit $env:GITHUB_REF_NAME --title "Elden Ring Native Windowed HDR $env:PACKAGE_VERSION" --notes-file RELEASE_NOTES.md --latest --repo $env:GITHUB_REPOSITORY
          }
          else {
              gh release create $env:GITHUB_REF_NAME $archive $checksum --verify-tag --title "Elden Ring Native Windowed HDR $env:PACKAGE_VERSION" --notes-file RELEASE_NOTES.md --latest --repo $env:GITHUB_REPOSITORY
          }
